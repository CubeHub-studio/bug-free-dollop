name: Custom Pages Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish with Git
    runs-on: ubuntu-latest

    steps:
      - name: Clone source repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source

      - name: Prepare standalone website
        run: |
          mkdir publish
          cp -a source/. publish/
          rm -rf publish/.git publish/.github
          touch publish/.nojekyll

      - name: Publish gh-pages branch using Git
        working-directory: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
