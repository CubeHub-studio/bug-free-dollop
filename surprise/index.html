<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101322">
<title>CLASSIFIED</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#34305c 0,#171a30 45%,#090b13 100%);color:#f5f3ff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{width:min(100%,520px);padding:30px 24px;border:1px solid #7772a866;border-radius:24px;background:#171a2bdc;box-shadow:0 24px 80px #0008;text-align:center}.stamp{font:700 11px ui-monospace,monospace;letter-spacing:.28em;color:#aaa4ff}.orb{width:92px;height:92px;margin:24px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#c5bfff 8%,#7770db 32%,#29264f 70%);box-shadow:0 0 42px #9188ff88;animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 65px #a79fffaa}}h1{font-size:clamp(27px,7vw,38px);margin:12px 0}p{line-height:1.6;color:#c9c7dc;min-height:52px}button{margin-top:16px;border:0;border-radius:999px;padding:14px 24px;background:#c5bfff;color:#17152b;font-weight:750;font-size:15px;cursor:pointer}button:active{transform:scale(.98)}.foot{margin-top:24px;font:10px ui-monospace,monospace;letter-spacing:.12em;color:#77758e}
</style>
</head>
<body>
<main class="panel">
<div class="stamp">UNAUTHORIZED CURIOSITY DIVISION</div>
<div class="orb" aria-hidden="true"></div>
<h1 id="heading">You found the door.</h1>
<p id="message">It would be rude not to see what's on the other side.</p>
<button id="action" type="button">Proceed</button>
<div class="foot">LOCAL EXPERIENCE · NO ACCOUNT · NO NETWORK REQUIRED</div>
</main>
<script>
const scenes=[
["A message from the future.","Remember this exact moment. It becomes a surprisingly good story.","Continue"],
["A tiny achievement has been unlocked.","You successfully investigated a button. The standards are low. The glory is real.","Accept achievement"],
["The universe has a suggestion.","Make something weird today. The world has enough ordinary things.","I accept"],
["Transmission complete.","Your curiosity remains operational. Have an excellent day.","Close transmission"]
];
let step=0;
const h=document.querySelector("#heading"),m=document.querySelector("#message"),b=document.querySelector("#action");
b.addEventListener("click",()=>{if(step<scenes.length){[h.textContent,m.textContent,b.textContent]=scenes[step++];}else{step=0;h.textContent="You found the door.";m.textContent="It would be rude not to see what's on the other side.";b.textContent="Proceed";}});
</script>
</body>
</html>
